<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!--
    Resolves every relative URL on the page (including the ones below)
    against the app's actual base path — "/" locally or in most
    deployments, "/<repo>/" on a GitHub Pages project site. Vite fills in
    the placeholder below at build time from the `base` config in
    vite.config.js (itself driven by the VITE_BASE_PATH env var — see
    .env.example). Doesn't affect any of the app's own API calls, which
    always use root-relative "/api/..." paths untouched by <base>.
  -->
  <base href="%BASE_URL%">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Meridian — Guess the Flag</title>
  <meta name="description" content="A world flag guessing game with continents, regions, and a full-world mode.">
  <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%/favicon-16.png">
  <link rel="apple-touch-icon" href="%BASE_URL%/apple-touch-icon.png">
  <link rel="manifest" href="%BASE_URL%/manifest.webmanifest">
  <meta name="theme-color" content="#101a23">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Meridian">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    // Counterpart of public/404.html's redirect (the "spa-github-pages"
    // trick): if we were bounced here from a 404 because someone deep-
    // linked or refreshed on a client-side route, the real path is
    // packed into the query string as "?/game&count=10" etc. This
    // unpacks it and restores the real URL via history.replaceState
    // *before* react-router reads the location, so the router still
    // renders the right screen and the address bar shows the original
    // clean URL rather than the redirect's query-string encoding.
    // No-op (and harmless) on every normal, non-404 page load.
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search
          .slice(1)
          .split('&')
          .map(function (s) {
            return s.replace(/~and~/g, '&');
          })
          .join('?');
        window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
      }
    })(window.location);
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./src/main.jsx"></script>
</body>
</html>
