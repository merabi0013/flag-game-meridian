<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Meridian</title>
  <!--
    GitHub Pages has no server-side rewrites, so a deep link or a page
    refresh on a client-side route (e.g. /flag-game-meridian/game) hits
    GitHub's static file server directly, finds no matching file, and
    serves this 404.html. Rather than switching react-router to hash
    routing (which changes every existing URL), this uses the standard
    "spa-github-pages" trick: encode the real path into a query string
    and redirect to the app's real index.html, where a matching snippet
    (see index.html) decodes it and hands the original URL back to
    react-router via history.replaceState — so this only ever shows for
    a fraction of a second, if at all, and the address bar ends up
    showing the original URL.

    This file is a TEMPLATE, not a static asset: vite.config.js emits it
    into dist/ as 404.html at build time with __BASE_SEGMENTS__ replaced by
    the number of path segments in the configured base (1 for
    "/flag-game-meridian/", 0 for "/"). It must NOT live in public/,
    because files there are copied verbatim and can't learn the base path
    (that's what previously sent "Play Again" to "/?/flag-game-meridian/...").
  -->
  <script>
    (function () {
      // Number of leading path segments that belong to the deployment's
      // base path rather than to the app's own routes (injected at build
      // time from Vite's `base`).
      var pathSegmentsToKeep = __BASE_SEGMENTS__;

      var l = window.location;
      var segments = l.pathname.split('/').slice(1);
      var basePart = segments.slice(0, pathSegmentsToKeep);
      var routePart = segments.slice(pathSegmentsToKeep);

      var redirectUrl =
        l.protocol +
        '//' +
        l.hostname +
        (l.port ? ':' + l.port : '') +
        (basePart.length ? '/' + basePart.join('/') : '') +
        '/?/' +
        routePart.join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash;

      window.location.replace(redirectUrl);
    })();
  </script>
</head>
<body>
  Redirecting…
</body>
</html>
